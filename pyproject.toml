[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traderlab"
version = "0.1.0"
description = "Professional algorithmic trading research platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "TraderLab Team" }]

dependencies = [
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.3,<1",
    "mypy>=1.8,<2",
]
dashboard = [
    "streamlit>=1.30,<2",
    "plotly>=5.18,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traderlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Pure unit tests with no external dependencies",
    "integration: Tests requiring external services (database, network)",
    "smoke: Quick sanity checks for project structure and imports",
]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "TC001", # move import into a type-checking block (incompatible with pydantic/runtime protocols)
    "TC002",
    "TC003",
    "RUF001", # ambiguous characters in strings (Turkish characters: ı, ş, ğ, etc.)
    "RUF002", # ambiguous characters in docstrings
    "RUF003", # ambiguous characters in comments
]

[tool.ruff.lint.isort]
known-first-party = ["traderlab"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "plotly.*",
    "streamlit.*",
]
ignore_missing_imports = true
